<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>길드 관리 시스템</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --primary: #1689d8;
    --primary-dark: #0968aa;
    --blue-light: #dff5ff;
    --pink: #ff9fca;
    --pink-light: #ffe4f0;
    --white: rgba(255,255,255,0.92);
    --text: #16324f;
    --shadow: 0 10px 30px rgba(0,70,130,0.15);
}

body {
    margin: 0;
    font-family:
        "Pretendard",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;

    color: var(--text);

    min-height: 100vh;

    background:
        linear-gradient(
            180deg,
            rgba(22,137,216,0.35),
            rgba(190,235,255,0.85)
        ),
        linear-gradient(
            180deg,
            #54c8f5 0%,
            #bceeff 48%,
            #e8faff 100%
        );

    background-attachment: fixed;
}

/* ========================================
   공통
======================================== */

.hidden {
    display: none !important;
}

button {
    border: none;
    cursor: pointer;
    font-family: inherit;
}

.card {
    background: var(--white);
    backdrop-filter: blur(12px);
    border-radius: 22px;
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
}

.page-title {
    font-size: 27px;
    font-weight: 800;
    margin-bottom: 20px;
}

.sub-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
}

/* ========================================
   로그인 / 최초 등록
======================================== */

#authScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.auth-box {
    width: 100%;
    max-width: 430px;

    background: rgba(255,255,255,0.93);
    border-radius: 30px;

    padding: 32px 26px;

    box-shadow:
        0 20px 50px rgba(0,90,160,0.2);
}

.logo {
    text-align: center;
    font-size: 42px;
    margin-bottom: 8px;
}

.auth-title {
    text-align: center;
    font-size: 27px;
    font-weight: 900;
    margin-bottom: 5px;
}

.auth-subtitle {
    text-align: center;
    color: #64809a;
    margin-bottom: 28px;
}

.input-group {
    margin-bottom: 16px;
}

.input-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 700;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid #cfe5f2;
    border-radius: 13px;
    padding: 13px;
    font-size: 15px;
    outline: none;
    background: white;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--primary);
}

.guild-select {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.guild-option {
    padding: 15px 8px;
    border-radius: 14px;
    background: #edf8fd;
    color: #28719c;
    font-weight: 800;
}

.guild-option.selected {
    background: linear-gradient(135deg,#1596e8,#48c8f5);
    color: white;
}

.main-btn {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    background: linear-gradient(
        135deg,
        #0786d7,
        #49c9f4
    );
    color: white;
    font-weight: 800;
    font-size: 16px;
    margin-top: 8px;
}

.error-message {
    color: #e64b78;
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
}

/* ========================================
   앱
======================================== */

#app {
    min-height: 100vh;
    padding-bottom: 90px;
}

.top-header {
    padding: 24px 18px 16px;
    max-width: 1000px;
    margin: auto;
}

.header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.guild-name {
    font-size: 22px;
    font-weight: 900;
}

.user-info {
    font-size: 13px;
    color: #50718a;
    text-align: right;
}

.role-badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    margin-top: 3px;
}

.role-admin {
    background: #ffe6a7;
    color: #9a6400;
}

.role-staff {
    background: #dbeeff;
    color: #1672ac;
}

.role-member {
    background: #eeeeee;
    color: #666;
}

/* ========================================
   메인
======================================== */

.main-container {
    max-width: 1000px;
    margin: auto;
    padding: 5px 18px 20px;
}

/* ========================================
   홈
======================================== */

.home-hero {
    background:
        linear-gradient(
            135deg,
            rgba(16,142,221,0.96),
            rgba(69,201,241,0.88)
        );

    color: white;
    border-radius: 27px;
    padding: 25px;
    margin-bottom: 18px;

    box-shadow: var(--shadow);
}

.home-hero h1 {
    margin: 0 0 7px;
    font-size: 29px;
}

.home-hero p {
    margin: 0;
    opacity: 0.9;
}

.home-stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
}

.stat-card {
    background: rgba(255,255,255,0.94);
    border-radius: 19px;
    padding: 19px 12px;
    text-align: center;
    box-shadow: var(--shadow);
}

.stat-label {
    font-size: 12px;
    color: #67869b;
    margin-bottom: 7px;
}

.stat-value {
    font-size: 23px;
    font-weight: 900;
    color: #116fae;
}

/* ========================================
   공지
======================================== */

.notice-card {
    position: relative;
}

.notice-content {
    white-space: pre-wrap;
    line-height: 1.7;
    color: #3e5d73;
}

.notice-date {
    font-size: 11px;
    color: #9aaeba;
    margin-top: 12px;
}

.notice-actions {
    margin-top: 15px;
    display: flex;
    gap: 8px;
}

.small-btn {
    padding: 9px 13px;
    border-radius: 10px;
    font-weight: 700;
    background: #e9f6fc;
    color: #24749d;
}

.small-btn.danger {
    background: #ffe6ee;
    color: #d65b7d;
}

/* ========================================
   하단 네비게이션
======================================== */

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

    height: 72px;

    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(15px);

    box-shadow: 0 -8px 25px rgba(0,80,140,0.12);

    display: flex;
    justify-content: center;

    z-index: 100;
}

.nav-inner {
    width: 100%;
    max-width: 1000px;

    display: grid;
    grid-template-columns: repeat(7,1fr);
}

.nav-btn {
    background: transparent;
    color: #7693a5;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 3px;

    font-size: 11px;
    font-weight: 700;
}

.nav-icon {
    font-size: 21px;
}

.nav-btn.active {
    color: #0785d5;
}

/* ========================================
   길드원
======================================== */

.member-row {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 15px 0;
    border-bottom: 1px solid #e8f1f5;
}

.member-row:last-child {
    border-bottom: none;
}

.member-name {
    font-weight: 800;
}

.member-role {
    font-size: 11px;
    margin-top: 4px;
    color: #7892a1;
}

.member-actions {
    display: flex;
    gap: 6px;
}

/* ========================================
   운영
======================================== */

.theme-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
}

.theme-btn {
    min-height: 100px;
    border-radius: 18px;

    font-size: 16px;
    font-weight: 900;

    color: white;

    box-shadow: 0 7px 20px rgba(0,0,0,0.12);
}

.theme-spring {
    background: linear-gradient(135deg,#ffb7c9,#b9e7b0);
}

.theme-summer {
    background: linear-gradient(135deg,#13a4e8,#65d8f2);
}

.theme-autumn {
    background: linear-gradient(135deg,#e88935,#c95738);
}

.theme-winter {
    background: linear-gradient(135deg,#8dc9f2,#dcefff);
}

/* ========================================
   모바일
======================================== */

@media(max-width:600px) {

    .home-stats {
        grid-template-columns: 1fr 1fr 1fr;
    }

    .stat-value {
        font-size: 19px;
    }

    .guild-name {
        font-size: 19px;
    }

    .nav-btn {
        font-size: 9px;
    }

    .nav-icon {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<!-- ======================================
     최초 접속 / 로그인
====================================== -->

<section id="authScreen">

    <div class="auth-box">

        <div class="logo">💙</div>

        <div class="auth-title">
            길드 관리 시스템
        </div>

        <div class="auth-subtitle">
            처음 접속하셨다면 길드원 등록을 진행해주세요.
        </div>

        <div class="input-group">

            <label>길드 선택</label>

            <div class="guild-select">

                <button
                    class="guild-option"
                    onclick="selectGuild('117번째우정',this)">
                    117번째우정
                </button>

                <button
                    class="guild-option"
                    onclick="selectGuild('117번째사랑',this)">
                    117번째사랑
                </button>

            </div>

        </div>

        <div class="input-group">

            <label>닉네임</label>

            <input
                id="nickname"
                type="text"
                placeholder="사용할 닉네임"
                maxlength="20"
            >

        </div>

        <div class="input-group">

            <label>비밀번호</label>

            <input
                id="password"
                type="password"
                placeholder="간단한 비밀번호"
                maxlength="30"
            >

        </div>

        <button
            class="main-btn"
            onclick="registerMember()">
            등록하고 시작하기
        </button>

        <div
            id="authError"
            class="error-message">
        </div>

    </div>

</section>


<!-- ======================================
     실제 앱
====================================== -->

<section id="app" class="hidden">

    <header class="top-header">

        <div class="header-inner">

            <div>
                <div class="guild-name" id="headerGuild">
                    117번째우정
                </div>
            </div>

            <div class="user-info">

                <div id="headerUser">
                    -
                </div>

                <div
                    id="headerRole"
                    class="role-badge">
                    -
                </div>

            </div>

        </div>

    </header>


    <main class="main-container">

        <!-- HOME -->

        <section
            id="page-home"
            class="page">

            <div class="home-hero">

                <h1>
                    <span id="homeGuildName"></span>
                    💙
                </h1>

                <p>
                    함께 만들어가는 우리의 길드
                </p>

            </div>


            <div class="home-stats">

                <div class="stat-card">

                    <div class="stat-label">
                        현재 길드순위
                    </div>

                    <div
                        class="stat-value"
                        id="guildRank">
                        -
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        총 길드원
                    </div>

                    <div
                        class="stat-value"
                        id="memberCount">
                        0명
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        현재 시즌
                    </div>

                    <div
                        class="stat-value"
                        id="currentSeason">
                        -
                    </div>

                </div>

            </div>


            <div class="card notice-card">

                <div class="page-title">
                    📢 길드 공지
                </div>

                <div
                    id="noticeContent"
                    class="notice-content">
                </div>

                <div
                    id="noticeDate"
                    class="notice-date">
                </div>

                <div
                    id="noticeActions"
                    class="notice-actions hidden">

                    <button
                        class="small-btn"
                        onclick="editNotice()">
                        공지 수정
                    </button>

                </div>

            </div>

        </section>


        <!-- 길드원 -->

        <section
            id="page-members"
            class="page hidden">

            <div class="page-title">
                길드원
            </div>

            <div class="card">

                <div id="memberList"></div>

            </div>

        </section>


        <!-- 토벌 -->

        <section
            id="page-raid"
            class="page hidden">

            <div class="page-title">
                토벌
            </div>

            <div class="card">

                <div class="sub-title">
                    토벌 기록
                </div>

                <p>
                    토벌 데이터는 이후 연결합니다.
                </p>

            </div>

        </section>


        <!-- 유물 -->

        <section
            id="page-relic"
            class="page hidden">

            <div class="page-title">
                유물
            </div>

            <div class="card">

                <div class="sub-title">
                    유물 점수
                </div>

                <p>
                    유물 데이터는 이후 연결합니다.
                </p>

            </div>

        </section>


        <!-- 챌프 -->

        <section
            id="page-champ"
            class="page hidden">

            <div class="page-title">
                챌프
            </div>

            <div class="card">

                <p>
                    챌프 비교 화면은 이후 연결합니다.
                </p>

            </div>

        </section>


        <!-- 개인 -->

        <section
            id="page-personal"
            class="page hidden">

            <div class="page-title">
                개인
            </div>

            <div class="card">

                <div class="sub-title">
                    내 정보
                </div>

                <div id="personalInfo"></div>

            </div>

        </section>


        <!-- 운영 -->

        <section
            id="page-admin"
            class="page hidden">

            <div class="page-title">
                운영
            </div>


            <!-- 테마 -->

            <div class="card">

                <div class="sub-title">
                    🎨 테마 선택
                </div>

                <div class="theme-grid">

                    <button
                        class="theme-btn theme-spring"
                        onclick="changeTheme('spring')">
                        🌸 봄
                    </button>

                    <button
                        class="theme-btn theme-summer"
                        onclick="changeTheme('summer')">
                        💙 여름
                    </button>

                    <button
                        class="theme-btn theme-autumn"
                        onclick="changeTheme('autumn')">
                        🍂 가을
                    </button>

                    <button
                        class="theme-btn theme-winter"
                        onclick="changeTheme('winter')">
                        ❄️ 겨울
                    </button>

                </div>

            </div>


            <!-- 공지 관리 -->

            <div
                id="noticeManagement"
                class="card">

                <div class="sub-title">
                    📢 공지 관리
                </div>

                <textarea
                    id="noticeEditor"
                    rows="5"
                    placeholder="길드 공지를 입력하세요.">
                </textarea>

                <button
                    class="main-btn"
                    onclick="saveNotice()">
                    공지 저장
                </button>

            </div>


            <!-- 권한 관리 -->

            <div
                id="permissionManagement"
                class="card">

                <div class="sub-title">
                    🛡️ 운영진 관리
                </div>

                <p style="font-size:13px;color:#789;">
                    최고 관리자만 운영진을 지정하거나 해제할 수 있습니다.
                </p>

                <div id="permissionList"></div>

            </div>

        </section>

    </main>


    <!-- 하단 메뉴 -->

    <nav class="bottom-nav">

        <div class="nav-inner">

            <button
                class="nav-btn active"
                onclick="showPage('home',this)">

                <span class="nav-icon">🏠</span>
                홈

            </button>


            <button
                class="nav-btn"
                onclick="showPage('members',this)">

                <span class="nav-icon">👥</span>
                길드원

            </button>


            <button
                class="nav-btn"
                onclick="showPage('raid',this)">

                <span class="nav-icon">⚔️</span>
                토벌

            </button>


            <button
                class="nav-btn"
                onclick="showPage('relic',this)">

                <span class="nav-icon">💎</span>
                유물

            </button>


            <button
                class="nav-btn"
                onclick="showPage('champ',this)">

                <span class="nav-icon">🏆</span>
                챌프

            </button>


            <button
                class="nav-btn"
                onclick="showPage('personal',this)">

                <span class="nav-icon">👤</span>
                개인

            </button>


            <button
                class="nav-btn"
                onclick="showPage('admin',this)">

                <span class="nav-icon">⚙️</span>
                운영

            </button>

        </div>

    </nav>

</section>


<script>

/* ========================================
   기본 데이터
======================================== */

const STORAGE_KEY = "guild_system_v1";

let selectedGuild = null;
let currentUser = null;

const defaultData = {

    guilds: {

        "117번째우정": {
            rank: "-",
            season: "1",
            notice: "길드 공지사항을 입력해주세요.",
            noticeDate: "",
            members: []
        },

        "117번째사랑": {
            rank: "-",
            season: "1",
            notice: "길드 공지사항을 입력해주세요.",
            noticeDate: "",
            members: []
        }

    },

    theme: "summer"

};


/* ========================================
   데이터 불러오기
======================================== */

function getData() {

    const saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(defaultData)
        );

        return structuredClone(defaultData);

    }

    return JSON.parse(saved);
}


function saveData(data) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* ========================================
   길드 선택
======================================== */

function selectGuild(guild, button) {

    selectedGuild = guild;

    document
        .querySelectorAll(".guild-option")
        .forEach(el => {
            el.classList.remove("selected");
        });

    button.classList.add("selected");

}


/* ========================================
   회원 등록
======================================== */

function registerMember() {

    const nickname =
        document
            .getElementById("nickname")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value
            .trim();

    const error =
        document.getElementById("authError");


    error.textContent = "";


    if (!selectedGuild) {

        error.textContent =
            "길드를 먼저 선택해주세요.";

        return;

    }


    if (!nickname) {

        error.textContent =
            "닉네임을 입력해주세요.";

        return;

    }


    if (!password) {

        error.textContent =
            "비밀번호를 입력해주세요.";

        return;

    }


    const data = getData();

    const guild =
        data.guilds[selectedGuild];


    const duplicate =
        guild.members.some(
            member =>
                member.nickname === nickname
        );


    if (duplicate) {

        error.textContent =
            "이미 등록된 닉네임입니다.";

        return;

    }


    /*
       첫 번째 등록자는 최고 관리자
    */

    const isFirstMember =
        guild.members.length === 0;


    const newMember = {

        id:
            Date.now().toString()
            + Math.random()
                .toString(36)
                .substring(2),

        nickname,

        password,

        role:
            isFirstMember
                ? "superadmin"
                : "member",

        raid: {},

        relic: {},

        champion: {}

    };


    guild.members.push(newMember);

    saveData(data);

    currentUser = newMember;

    enterApp();

}


/* ========================================
   앱 진입
======================================== */

function enterApp() {

    document
        .getElementById("authScreen")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");


    renderAll();

}


/* ========================================
   전체 화면 렌더링
======================================== */

function renderAll() {

    const data = getData();

    const guild =
        data.guilds[currentUser.guild];


    document
        .getElementById("headerGuild")
        .textContent =
            currentUser.guild;


    document
        .getElementById("headerUser")
        .textContent =
            currentUser.nickname;


    const roleElement =
        document.getElementById("headerRole");


    roleElement.className =
        "role-badge";


    if (currentUser.role === "superadmin") {

        roleElement.textContent =
            "👑 최고 관리자";

        roleElement.classList.add(
            "role-admin"
        );

    }

    else if (currentUser.role === "staff") {

        roleElement.textContent =
            "🛡️ 운영진";

        roleElement.classList.add(
            "role-staff"
        );

    }

    else {

        roleElement.textContent =
            "👤 길드원";

        roleElement.classList.add(
            "role-member"
        );

    }


    document
        .getElementById("homeGuildName")
        .textContent =
            currentUser.guild;


    document
        .getElementById("guildRank")
        .textContent =
            guild.rank === "-"
                ? "-"
                : guild.rank + "위";


    document
        .getElementById("memberCount")
        .textContent =
            guild.members.length + "명";


    document
        .getElementById("currentSeason")
        .textContent =
            guild.season + "시즌";


    document
        .getElementById("noticeContent")
        .textContent =
            guild.notice || "등록된 공지가 없습니다.";


    document
        .getElementById("noticeDate")
        .textContent =
            guild.noticeDate
                ? "등록일 : " + guild.noticeDate
                : "";


    renderMembers();
    renderPersonal();
    renderPermissions();
    renderAdminVisibility();

}


/* ========================================
   길드원 화면
======================================== */

function renderMembers() {

    const data = getData();

    const guild =
        data.guilds[currentUser.guild];

    const list =
        document.getElementById("memberList");


    list.innerHTML = "";


    guild.members.forEach(member => {

        const row =
            document.createElement("div");

        row.className =
            "member-row";


        let roleText = "길드원";

        if (member.role === "superadmin") {
            roleText = "👑 최고 관리자";
        }

        else if (member.role === "staff") {
            roleText = "🛡️ 운영진";
        }


        row.innerHTML = `

            <div>

                <div class="member-name">
                    ${escapeHTML(member.nickname)}
                </div>

                <div class="member-role">
                    ${roleText}
                </div>

            </div>

        `;


        /*
           일반 길드원은
           다른 사람의 상세 데이터 접근 불가.

           따라서 길드원 화면에서는
           이름/권한 정도만 표시.
        */


        list.appendChild(row);

    });

}


/* ========================================
   개인 화면
======================================== */

function renderPersonal() {

    const data = getData();

    const guild =
        data.guilds[currentUser.guild];


    const me =
        guild.members.find(
            member =>
                member.id === currentUser.id
        );


    const area =
        document.getElementById(
            "personalInfo"
        );


    area.innerHTML = `

        <p>
            <strong>닉네임</strong><br>
            ${escapeHTML(me.nickname)}
        </p>

        <p>
            <strong>권한</strong><br>
            ${getRoleName(me.role)}
        </p>

        <hr>

        <button
            class="small-btn"
            onclick="changeNickname()">
            닉네임 변경
        </button>

        <button
            class="small-btn"
            onclick="changePassword()">
            비밀번호 변경
        </button>

    `;

}


/* ========================================
   권한 관리
======================================== */

function renderPermissions() {

    const data = getData();

    const guild =
        data.guilds[currentUser.guild];


    const area =
        document.getElementById(
            "permissionList"
        );


    area.innerHTML = "";


    if (currentUser.role !== "superadmin") {

        area.innerHTML =
            `<p style="color:#999;">
                최고 관리자만 권한을 관리할 수 있습니다.
             </p>`;

        return;

    }


    guild.members.forEach(member => {

        if (
            member.id === currentUser.id
            &&
            member.role === "superadmin"
        ) {
            return;
        }


        const row =
            document.createElement("div");

        row.className =
            "member-row";


        const isStaff =
            member.role === "staff";


        row.innerHTML = `

            <div>

                <div class="member-name">
                    ${escapeHTML(member.nickname)}
                </div>

                <div class="member-role">
                    ${getRoleName(member.role)}
                </div>

            </div>

            <div class="member-actions">

                <button
                    class="small-btn"
                    onclick="toggleStaff('${member.id}')">

                    ${
                        isStaff
                            ? "운영진 해제"
                            : "운영진 지정"
                    }

                </button>

            </div>

        `;


        area.appendChild(row);

    });

}


/* ========================================
   운영 화면 권한
======================================== */

function renderAdminVisibility() {

    const data = getData();

    const guild =
        data.guilds[currentUser.guild];


    const noticeActions =
        document.getElementById(
            "noticeActions"
        );


    /*
       공지 수정은 운영진 이상
    */

    if (
        currentUser.role === "superadmin"
        ||
        currentUser.role === "staff"
    ) {

        noticeActions.classList.remove(
            "hidden"
        );

    }

    else {

        noticeActions.classList.add(
            "hidden"
        );

    }


    /*
       운영 화면 자체는
       모두 볼 수 있지만,
       권한 관리 기능은 최고 관리자만.
    */

    const permission =
        document.getElementById(
            "permissionManagement"
        );


    if (currentUser.role === "superadmin") {

        permission.classList.remove(
            "hidden"
        );

    }

    else {

        permission.classList.add(
            "hidden"
        );

    }


    document
        .getElementById("noticeEditor")
        .value =
            guild.notice || "";

}


/* ========================================
   운영진 지정
======================================== */

function toggleStaff(memberId) {

    if (currentUser.role !== "superadmin") {

        alert(
            "최고 관리자만 권한을 변경할 수 있습니다."
        );

        return;

    }


    const data = getData();

    const guild =
        data.guilds[currentUser.guild];


    const member =
        guild.members.find(
            m => m.id === memberId
        );


    if (!member) return;


    if (member.role === "staff") {

        member.role = "member";

    }

    else {

        member.role = "staff";

    }


    saveData(data);

    renderAll();

}


/* ========================================
   공지 저장
======================================== */

function saveNotice() {

    if (
        currentUser.role !== "superadmin"
        &&
        currentUser.role !== "staff"
    ) {

        alert(
            "공지 수정 권한이 없습니다."
        );

        return;

    }


    const data = getData();

    const guild =
        data.guilds[currentUser.guild];


    guild.notice =
        document
            .getElementById("noticeEditor")
            .value
            .trim();


    guild.noticeDate =
        new Date().toLocaleDateString(
            "ko-KR"
        );


    saveData(data);

    renderAll();

    alert("공지가 저장되었습니다.");

}


/* ========================================
   공지 수정
======================================== */

function editNotice() {

    showPage(
        "admin",
        document.querySelectorAll(
            ".nav-btn"
        )[6]
    );

}


/* ========================================
   닉네임 변경
======================================== */

function changeNickname() {

    const newName =
        prompt(
            "새 닉네임을 입력해주세요.",
            currentUser.nickname
        );


    if (!newName) return;


    const name =
        newName.trim();


    if (!name) return;


    const data = getData();

    const guild =
        data.guilds[currentUser.guild];


    const duplicate =
        guild.members.some(
            member =>
                member.id !== currentUser.id
                &&
                member.nickname === name
        );


    if (duplicate) {

        alert(
            "이미 사용 중인 닉네임입니다."
        );

        return;

    }


    const member =
        guild.members.find(
            m => m.id === currentUser.id
        );


    member.nickname = name;

    currentUser.nickname = name;


    saveData(data);

    renderAll();

}


/* ========================================
   비밀번호 변경
======================================== */

function changePassword() {

    const newPassword =
        prompt(
            "새 비밀번호를 입력해주세요."
        );


    if (!newPassword) return;


    const data = getData();

    const guild =
        data.guilds[currentUser.guild];


    const member =
        guild.members.find(
            m => m.id === currentUser.id
        );


    member.password =
        newPassword;


    currentUser.password =
        newPassword;


    saveData(data);


    alert(
        "비밀번호가 변경되었습니다."
    );

}


/* ========================================
   테마
======================================== */

function changeTheme(theme) {

    const data = getData();

    data.theme = theme;

    saveData(data);


    document.body.dataset.theme =
        theme;


    applyTheme(theme);

}


function applyTheme(theme) {

    if (theme === "spring") {

        document.body.style.background =
            "linear-gradient(180deg,#ffd4e1,#f4ffe8)";

    }

    else if (theme === "summer") {

        document.body.style.background =
            "linear-gradient(180deg,#51c8f3,#dff8ff)";

    }

    else if (theme === "autumn") {

        document.body.style.background =
            "linear-gradient(180deg,#f4b06a,#ffe1bd)";

    }

    else if (theme === "winter") {

        document.body.style.background =
            "linear-gradient(180deg,#9ed8ff,#f1faff)";

    }

}


/* ========================================
   화면 전환
======================================== */

function showPage(page, button) {

    document
        .querySelectorAll(".page")
        .forEach(
            el =>
                el.classList.add("hidden")
        );


    document
        .getElementById(
            "page-" + page
        )
        .classList.remove("hidden");


    document
        .querySelectorAll(".nav-btn")
        .forEach(
            el =>
                el.classList.remove("active")
        );


    button.classList.add("active");


    renderAll();

}


/* ========================================
   권한 이름
======================================== */

function getRoleName(role) {

    if (role === "superadmin") {
        return "👑 최고 관리자";
    }

    if (role === "staff") {
        return "🛡️ 운영진";
    }

    return "👤 길드원";

}


/* ========================================
   HTML 보안 처리
======================================== */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ========================================
   초기 실행
======================================== */

(function init() {

    const data = getData();

    applyTheme(data.theme);

})();

</script>

</body>
</html>

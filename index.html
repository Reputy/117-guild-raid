<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>길드 관리</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111827;
      color: #f9fafb;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      min-height: 100vh;
    }

    /* =========================
       공통
    ========================= */

    .screen {
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .hidden {
      display: none !important;
    }

    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .title {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 800;
    }

    .subtitle {
      margin: 0;
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.5;
    }

    /* =========================
       등록 / 로그인
    ========================= */

    .auth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #f59e0b;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
    }

    .auth-box h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .auth-description {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #d1d5db;
      font-size: 14px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #4b5563;
      border-radius: 10px;
      outline: none;
      background: #111827;
      color: #fff;
    }

    .field input:focus {
      border-color: #f59e0b;
    }

    .primary-button {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 10px;
      background: #f59e0b;
      color: #111827;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
    }

    .primary-button:hover {
      background: #fbbf24;
    }

    .secondary-button {
      width: 100%;
      height: 46px;
      border: 1px solid #4b5563;
      border-radius: 10px;
      background: transparent;
      color: #d1d5db;
      cursor: pointer;
      margin-top: 10px;
    }

    .message {
      min-height: 20px;
      margin-top: 14px;
      color: #f87171;
      font-size: 13px;
      text-align: center;
    }

    /* =========================
       홈
    ========================= */

    .home-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }

    .guild-name {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
    }

    .welcome {
      margin-top: 5px;
      color: #9ca3af;
      font-size: 14px;
    }

    .logout-button {
      flex-shrink: 0;
      border: 1px solid #4b5563;
      background: #1f2937;
      color: #d1d5db;
      padding: 9px 13px;
      border-radius: 9px;
      cursor: pointer;
    }

    /* =========================
       길드 기본 정보
    ========================= */

    .guild-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .info-item {
      background: #111827;
      border-radius: 12px;
      padding: 15px 10px;
      text-align: center;
    }

    .info-label {
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .info-value {
      font-size: 19px;
      font-weight: 800;
    }

    /* =========================
       보스 딜
    ========================= */

    .section-title {
      margin: 0 0 15px;
      font-size: 18px;
      font-weight: 800;
    }

    .boss-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .boss-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .boss-card {
      background: #111827;
      border-radius: 12px;
      padding: 15px;
    }

    .boss-name {
      font-weight: 700;
      margin-bottom: 10px;
    }

    .boss-value {
      color: #fbbf24;
      font-size: 18px;
      font-weight: 800;
    }

    .boss-unit {
      color: #9ca3af;
      font-size: 12px;
      margin-left: 3px;
    }

    /* =========================
       딜컷
    ========================= */

    .damage-cut-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .damage-cut {
      background: #111827;
      border-radius: 12px;
      padding: 15px;
    }

    .damage-cut-label {
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .damage-cut-value {
      font-size: 18px;
      font-weight: 800;
    }

    .internal {
      color: #60a5fa;
    }

    .target {
      color: #34d399;
    }

    /* =========================
       길드원
    ========================= */

    .member-count {
      color: #9ca3af;
      font-size: 13px;
      margin-left: 5px;
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .member {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      border-radius: 10px;
      padding: 13px 15px;
    }

    .member-name {
      font-weight: 700;
    }

    .member-status {
      color: #6b7280;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .screen {
        padding: 18px 12px 30px;
      }

      .guild-info {
        grid-template-columns: 1fr;
      }

      .boss-row {
        grid-template-columns: 1fr;
      }

      .damage-cut-list {
        grid-template-columns: 1fr;
      }

      .home-header {
        align-items: center;
      }

      .guild-name {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =====================================
       최초 등록 / 로그인 화면
  ====================================== -->

  <section id="authScreen" class="screen auth-screen">
    <div class="auth-box">

      <div class="logo">G</div>

      <h1 id="authTitle">길드원 등록</h1>

      <p id="authDescription" class="auth-description">
        처음 접속하셨다면 닉네임과 비밀번호를 등록해주세요.
      </p>

      <form id="authForm">

        <div class="field">
          <label for="nickname">닉네임</label>
          <input
            id="nickname"
            type="text"
            maxlength="20"
            autocomplete="username"
            placeholder="길드에서 사용할 닉네임"
            required
          />
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <input
            id="password"
            type="password"
            maxlength="20"
            autocomplete="current-password"
            placeholder="간단한 비밀번호"
            required
          />
        </div>

        <button id="authButton" class="primary-button" type="submit">
          길드원 등록
        </button>

      </form>

      <button
        id="switchAuthButton"
        class="secondary-button"
        type="button"
      >
        이미 등록했어요
      </button>

      <div id="authMessage" class="message"></div>

    </div>
  </section>


  <!-- =====================================
       홈 화면
  ====================================== -->

  <section id="homeScreen" class="screen hidden">

    <div class="container">

      <header class="home-header">

        <div>
          <h1 class="guild-name">우리길드</h1>
          <div id="welcomeText" class="welcome"></div>
        </div>

        <button id="logoutButton" class="logout-button">
          로그아웃
        </button>

      </header>


      <!-- 길드 기본 정보 -->

      <div class="card">

        <div class="guild-info">

          <div class="info-item">
            <div class="info-label">현재 순위</div>
            <div class="info-value">12위</div>
          </div>

          <div class="info-item">
            <div class="info-label">길드원</div>
            <div id="memberCount" class="info-value">0명</div>
          </div>

          <div class="info-item">
            <div class="info-label">현재 시즌</div>
            <div class="info-value">시즌 1</div>
          </div>

        </div>

      </div>


      <!-- 보스 최근 딜 -->

      <div class="card">

        <h2 class="section-title">
          보스별 최근 딜
        </h2>

        <div class="boss-list">

          <div class="boss-row">

            <div class="boss-card">
              <div class="boss-name">보스 1</div>
              <div class="boss-value">
                0
                <span class="boss-unit">평균</span>
              </div>
            </div>

            <div class="boss-card">
              <div class="boss-name">보스 2</div>
              <div class="boss-value">
                0
                <span class="boss-unit">평균</span>
              </div>
            </div>

          </div>

          <div class="boss-row">

            <div class="boss-card">
              <div class="boss-name">보스 3</div>
              <div class="boss-value">
                0
                <span class="boss-unit">평균</span>
              </div>
            </div>

            <div class="boss-card">
              <div class="boss-name">보스 4</div>
              <div class="boss-value">
                0
                <span class="boss-unit">평균</span>
              </div>
            </div>

          </div>

        </div>

      </div>


      <!-- 보스 딜컷 -->

      <div class="card">

        <h2 class="section-title">
          보스 딜컷
        </h2>

        <div class="damage-cut-list">

          <div class="damage-cut">
            <div class="damage-cut-label">
              내부 딜컷
            </div>

            <div class="damage-cut-value internal">
              0
            </div>
          </div>

          <div class="damage-cut">
            <div class="damage-cut-label">
              목표 딜컷
            </div>

            <div class="damage-cut-value target">
              0
            </div>
          </div>

        </div>

      </div>


      <!-- 길드원 목록 -->

      <div class="card">

        <h2 class="section-title">
          길드원
          <span id="memberCountTitle" class="member-count">
            0명
          </span>
        </h2>

        <div id="memberList" class="member-list"></div>

      </div>

    </div>

  </section>

</div>


<script>
  /*
   * ==========================================
   * 기본 데이터 구조
   * ==========================================
   *
   * 회원 ID를 별도로 가지고 있기 때문에
   * 나중에 닉네임을 변경해도 기존 기록을 유지할 수 있음.
   *
   * 예:
   *
   * {
   *   id: "M001",
   *   nickname: "홍길동",
   *   password: "1234",
   *   createdAt: "..."
   * }
   *
   */

  const STORAGE_KEY = "guild_members";
  const LOGIN_KEY = "guild_current_member";


  /* ------------------------------------------
     DOM
  ------------------------------------------ */

  const authScreen = document.getElementById("authScreen");
  const homeScreen = document.getElementById("homeScreen");

  const authForm = document.getElementById("authForm");

  const authTitle = document.getElementById("authTitle");
  const authDescription = document.getElementById("authDescription");
  const authButton = document.getElementById("authButton");

  const switchAuthButton =
    document.getElementById("switchAuthButton");

  const authMessage =
    document.getElementById("authMessage");

  const nicknameInput =
    document.getElementById("nickname");

  const passwordInput =
    document.getElementById("password");

  const welcomeText =
    document.getElementById("welcomeText");

  const logoutButton =
    document.getElementById("logoutButton");

  const memberCount =
    document.getElementById("memberCount");

  const memberCountTitle =
    document.getElementById("memberCountTitle");

  const memberList =
    document.getElementById("memberList");


  /* ------------------------------------------
     상태
  ------------------------------------------ */

  let isLoginMode = false;


  /* ------------------------------------------
     회원 데이터
  ------------------------------------------ */

  function getMembers() {
    try {
      return JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      ) || [];
    } catch (error) {
      return [];
    }
  }


  function saveMembers(members) {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(members)
    );
  }


  function getCurrentMember() {
    const memberId =
      localStorage.getItem(LOGIN_KEY);

    if (!memberId) {
      return null;
    }

    const members = getMembers();

    return members.find(
      member => member.id === memberId
    ) || null;
  }


  /* ------------------------------------------
     회원 ID 생성
  ------------------------------------------ */

  function createMemberId() {

    const members = getMembers();

    return "M" +
      String(members.length + 1)
        .padStart(3, "0");
  }


  /* ------------------------------------------
     화면 전환
  ------------------------------------------ */

  function showAuth() {

    authScreen.classList.remove("hidden");
    homeScreen.classList.add("hidden");

    nicknameInput.value = "";
    passwordInput.value = "";
    authMessage.textContent = "";
  }


  function showHome() {

    authScreen.classList.add("hidden");
    homeScreen.classList.remove("hidden");

    renderHome();
  }


  /* ------------------------------------------
     홈 화면
  ------------------------------------------ */

  function renderHome() {

    const currentMember =
      getCurrentMember();

    if (!currentMember) {
      showAuth();
      return;
    }

    const members = getMembers();

    welcomeText.textContent =
      `${currentMember.nickname}님, 환영합니다.`;

    const countText =
      `${members.length}명`;

    memberCount.textContent = countText;
    memberCountTitle.textContent = countText;

    renderMemberList(members);
  }


  /* ------------------------------------------
     길드원 목록
  ------------------------------------------ */

  function renderMemberList(members) {

    memberList.innerHTML = "";

    if (members.length === 0) {

      const empty =
        document.createElement("div");

      empty.className = "member";

      empty.textContent =
        "등록된 길드원이 없습니다.";

      memberList.appendChild(empty);

      return;
    }


    members.forEach(member => {

      const item =
        document.createElement("div");

      item.className = "member";

      item.innerHTML = `
        <span class="member-name">
          ${escapeHtml(member.nickname)}
        </span>

        <span class="member-status">
          길드원
        </span>
      `;

      memberList.appendChild(item);

    });
  }


  /* ------------------------------------------
     HTML 안전 처리
  ------------------------------------------ */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* ------------------------------------------
     등록
  ------------------------------------------ */

  function registerMember(
    nickname,
    password
  ) {

    const members = getMembers();

    const cleanNickname =
      nickname.trim();

    /*
     * 닉네임 중복 방지
     */

    const duplicate =
      members.some(
        member =>
          member.nickname.toLowerCase() ===
          cleanNickname.toLowerCase()
      );

    if (duplicate) {

      throw new Error(
        "이미 등록된 닉네임입니다."
      );
    }


    /*
     * 회원 생성
     */

    const newMember = {

      id: createMemberId(),

      nickname: cleanNickname,

      password: password,

      createdAt:
        new Date().toISOString(),

      /*
       * 앞으로 사용할 데이터
       */

      battleRecords: [],

      relicScore: 0

    };


    members.push(newMember);

    saveMembers(members);

    /*
     * 자동 로그인
     */

    localStorage.setItem(
      LOGIN_KEY,
      newMember.id
    );

    return newMember;
  }


  /* ------------------------------------------
     로그인
  ------------------------------------------ */

  function loginMember(
    nickname,
    password
  ) {

    const members = getMembers();

    const member =
      members.find(
        member =>
          member.nickname.toLowerCase() ===
            nickname.trim().toLowerCase() &&
          member.password === password
      );


    if (!member) {

      throw new Error(
        "닉네임 또는 비밀번호가 올바르지 않습니다."
      );
    }


    localStorage.setItem(
      LOGIN_KEY,
      member.id
    );

    return member;
  }


  /* ------------------------------------------
     등록 / 로그인 처리
  ------------------------------------------ */

  authForm.addEventListener(
    "submit",
    function(event) {

      event.preventDefault();

      const nickname =
        nicknameInput.value.trim();

      const password =
        passwordInput.value.trim();


      if (!nickname) {

        authMessage.textContent =
          "닉네임을 입력해주세요.";

        return;
      }


      if (!password) {

        authMessage.textContent =
          "비밀번호를 입력해주세요.";

        return;
      }


      try {

        if (isLoginMode) {

          loginMember(
            nickname,
            password
          );

        } else {

          registerMember(
            nickname,
            password
          );

        }


        authMessage.textContent = "";

        showHome();


      } catch (error) {

        authMessage.textContent =
          error.message;

      }

    }
  );


  /* ------------------------------------------
     등록 ↔ 로그인 전환
  ------------------------------------------ */

  switchAuthButton.addEventListener(
    "click",
    function() {

      isLoginMode =
        !isLoginMode;


      if (isLoginMode) {

        authTitle.textContent =
          "길드원 로그인";

        authDescription.textContent =
          "등록한 닉네임과 비밀번호로 로그인해주세요.";

        authButton.textContent =
          "로그인";

        switchAuthButton.textContent =
          "처음 등록하는 길드원이에요";

      } else {

        authTitle.textContent =
          "길드원 등록";

        authDescription.textContent =
          "처음 접속하셨다면 닉네임과 비밀번호를 등록해주세요.";

        authButton.textContent =
          "길드원 등록";

        switchAuthButton.textContent =
          "이미 등록했어요";

      }


      authMessage.textContent = "";

      nicknameInput.focus();

    }
  );


  /* ------------------------------------------
     로그아웃
  ------------------------------------------ */

  logoutButton.addEventListener(
    "click",
    function() {

      localStorage.removeItem(
        LOGIN_KEY
      );

      isLoginMode = true;

      authTitle.textContent =
        "길드원 로그인";

      authDescription.textContent =
        "등록한 닉네임과 비밀번호로 로그인해주세요.";

      authButton.textContent =
        "로그인";

      switchAuthButton.textContent =
        "처음 등록하는 길드원이에요";

      showAuth();

    }
  );


  /* ------------------------------------------
     최초 실행
  ------------------------------------------ */

  function initialize() {

    const currentMember =
      getCurrentMember();


    if (currentMember) {

      showHome();

    } else {

      /*
       * 회원이 하나도 없으면
       * 최초 등록 화면
       */

      const members = getMembers();

      if (members.length === 0) {

        isLoginMode = false;

        authTitle.textContent =
          "길드원 등록";

        authDescription.textContent =
          "처음 접속하셨다면 닉네임과 비밀번호를 등록해주세요.";

        authButton.textContent =
          "길드원 등록";

        switchAuthButton.textContent =
          "이미 등록했어요";

      } else {

        isLoginMode = true;

        authTitle.textContent =
          "길드원 로그인";

        authDescription.textContent =
          "등록한 닉네임과 비밀번호로 로그인해주세요.";

        authButton.textContent =
          "로그인";

        switchAuthButton.textContent =
          "처음 등록하는 길드원이에요";
      }

      showAuth();
    }
  }


  initialize();

</script>

</body>
</html>
